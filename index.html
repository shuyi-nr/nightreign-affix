    <style>
      /* Real loading shell: no remote fonts or artificial startup delay. */
      html, body { margin: 0; background: #080a10; }
      .boot-splash {
        position: fixed; inset: 0; z-index: 1000; cursor: pointer;
        isolation: isolate; overflow: hidden; box-sizing: border-box;
        min-height: 100vh; min-height: 100svh; padding: 40px 20px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #d4b474; text-align: center;
        background: radial-gradient(ellipse at 50% 49%, #c9a25c13, transparent 49%),
          radial-gradient(ellipse at 50% 100%, #24395035, transparent 65%), #080a10;
      }
      .boot-splash::before {
        content: ''; position: absolute; z-index: -1; width: min(66vw, 600px); aspect-ratio: 1;
        border-radius: 50%; border: 1px solid #7192c41a;
        box-shadow: 0 0 100px #c9a25c08, inset 0 0 90px #101b3655;
        transform: translateY(-12px) skewX(-18deg) scaleY(.7) rotate(-16deg);
      }
      .boot-kicker { font: italic 10px/1.6 Georgia, serif; letter-spacing: .42em; color: #9a8660; margin-bottom: 48px; }
      .boot-sigil { position: relative; width: 30px; height: 30px; margin-bottom: 24px; border: 1px solid #c9a25c80; transform: rotate(45deg); box-shadow: 0 0 24px #c9a25c15; }
      .boot-sigil::before { content: ''; position: absolute; inset: 7px; border: 1px solid #e8c884; }
      .boot-title {
        position: relative; isolation: isolate; margin: 8px 0 28px;
        font-family: 'STKaiti', 'KaiTi', '楷体', 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
        font-size: clamp(32px, 7.2vw, 102px); font-style: italic; font-weight: 900; line-height: 1.4; letter-spacing: .025em;
        color: #edcf94; white-space: nowrap; transform: skewX(-13deg);
      }
      .boot-title::after {
        content: ''; position: absolute; left: -4%; right: -8%; bottom: 11%; height: 2px;
        background: linear-gradient(90deg, transparent, #7494bd80 12%, #fff2cc 64%, #b78939 86%, transparent);
        box-shadow: 0 7px 0 #c9a25c13, 0 0 16px #dfc48a65;
        clip-path: polygon(0 70%, 95% 0, 100% 30%, 10% 100%);
      }
      /* Give the italic glyphs room to extend beyond their text run. */
      .boot-title-text, .boot-shine { padding: 12px .42em 24px; }
      .boot-title-text { display: block; }
      @supports (-webkit-background-clip: text) {
        .boot-title-text {
          background: linear-gradient(168deg, #fff9df 8%, #e6ce97 35%, #c69a50 48%, #fff2bf 54%, #d5af62 66%, #76532b 91%);
          -webkit-background-clip: text; background-clip: text; color: transparent;
        }
      }
      .boot-shine { display: none; }
      @supports (-webkit-background-clip: text) {
        .boot-shine {
          display: block; position: absolute; inset: 0; z-index: 2;
          pointer-events: none; color: transparent; text-shadow: none;
          background-image: linear-gradient(108deg, transparent 42%, #eaf5ff77 46%, #fff 49%, #fff 51%, #eaf5ff77 54%, transparent 58%);
          background-size: 250% 100%; background-repeat: no-repeat;
          -webkit-background-clip: text; background-clip: text;
          animation: boot-shine-pass 3.8s ease-in-out infinite;
        }
      }
      .boot-rule { display: flex; align-items: center; gap: 14px; width: min(72vw, 390px); margin-top: 6px; }
      .boot-rule::before, .boot-rule::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, #c9a25c70); }
      .boot-rule::after { transform: rotate(180deg); }
      .boot-rule span { width: 4px; height: 4px; border: 1px solid #c9a25c; transform: rotate(45deg); }
      .boot-text { margin: 32px 0 0; font: 10px/1.7 system-ui, sans-serif; letter-spacing: .35em; color: #8c8990; }
      .boot-progress { position: relative; overflow: hidden; width: 96px; height: 1px; background: #c9a25c20; margin-top: 16px; }
      .boot-progress::after { content: ''; position: absolute; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, #e8c884, transparent); animation: boot-travel 2s ease-in-out infinite; }
      .boot-skip { margin-top: 25px; min-height: 44px; padding: 8px 20px; border: 1px solid #c9a25c45; border-radius: 24px; background: #11151dcc; color: #b9aa8f; font: 12px system-ui, sans-serif; cursor: pointer; letter-spacing: .15em; }
      .boot-skip:focus-visible { outline: 2px solid #edcf94; outline-offset: 4px; }
      .boot-recovery { max-width: 340px; margin: 16px 24px 0; color: #b9aa8f; font: 13px/1.8 system-ui, sans-serif; text-align: center; }
      .boot-recovery[hidden] { display: none; }
      .boot-recovery p { margin: 8px 0; }
      .boot-recovery .boot-skip { margin-top: 8px; }
      .boot-recovery small { display: block; margin-top: 8px; color: #8e929c; }
      @keyframes boot-shine-pass { 0%, 4% { background-position: 120% 50%; } 48%, 100% { background-position: -120% 50%; } }
      @keyframes boot-travel { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
      @media (max-width: 480px) { .boot-kicker { font-size: 9px; letter-spacing: .22em; margin-bottom: 30px; } .boot-title { letter-spacing: 0; margin-bottom: 18px; } .boot-splash::before { width: 86vw; } }
      @media (prefers-reduced-motion: reduce) { .boot-title, .boot-progress::after, .boot-shine { animation: none; } .boot-shine { display: none; } }
    </style>
  </head>
  <body>
    <div id="root" inert></div>
      <div id="boot-screen" class="boot-splash" aria-label="黑夜从未结束，正在加载遗物检测站">
        <div class="boot-kicker" aria-hidden="true">ELDEN RING NIGHTREIGN</div>
        <div class="boot-sigil" aria-hidden="true"></div>
        <h1 class="boot-title"><span class="boot-title-text">黑夜从未结束</span><span class="boot-shine" aria-hidden="true">黑夜从未结束</span></h1>
        <div class="boot-rule" aria-hidden="true"><span></span></div>
        <p class="boot-text">正在唤醒遗物档案</p>
        <div class="boot-progress" aria-hidden="true"></div>
        <button class="boot-skip" type="button">点击跳过</button>
        <div class="boot-recovery" hidden role="status" aria-live="polite">
          <p id="boot-recovery-message"></p>
          <button class="boot-skip" id="boot-reload" type="button">重新加载</button>
          <small>重新加载会保留本地收藏</small>
        </div>
      </div>
    <script>
      (function () {
        var screen = document.getElementById('boot-screen');
        var root = document.getElementById('root');
        var panel = screen.querySelector('.boot-recovery');
        var message = document.getElementById('boot-recovery-message');
        var skip = screen.querySelector('button');
        var ready = false;
        var retrying = false;
        var retryKey = 'nr-recover';
        var scope = new URL('./', location.href).href;
        var recoveryAttempt = new URL(location.href).searchParams.has(retryKey);
        screen.dataset.started = String(performance.now());

        function showIssue(text) {
          if (ready || !screen.isConnected) return;
          panel.hidden = false;
          message.textContent = text;
          screen.querySelector('.boot-text').textContent = '连接暂时遇到问题';
          skip.hidden = true;
        }
        function retry() {
          if (ready || retrying) return;
          retrying = true;
          showIssue('正在重新获取网站文件，请稍候…');
          var button = document.getElementById('boot-reload');
          button.disabled = true;
          button.textContent = '正在重新加载…';
          var url = new URL(location.href);
          url.searchParams.set(retryKey, String(Date.now()));
          var navigated = false;
          function reload() {
            if (navigated || ready) return;
            navigated = true;
            location.replace(url.href);
          }
          var tasks = [];
          // Only this site's offline files are reset; favorites stay untouched.
          if ('serviceWorker' in navigator) tasks.push(navigator.serviceWorker.getRegistrations().then(function (workers) {
            return Promise.all(workers.filter(function (worker) { return worker.scope === scope; }).map(function (worker) { return worker.unregister(); }));
          }).catch(function () {}));
          if ('caches' in window) tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (key) { return key.indexOf('nightreign-affix-') === 0; }).map(function (key) { return caches.delete(key); }));
          }).catch(function () {}));
          Promise.all(tasks).then(reload, reload);
          setTimeout(reload, 1500);
        }
        function failed() {
          if (ready) return;
          showIssue(navigator.onLine === false ? '当前网络不可用，请恢复连接后重新加载。' : '网站文件未能完整加载，请重新加载。');
          if (!recoveryAttempt && navigator.onLine !== false) retry();
        }
        function appReady() {
          if (ready) return;
          ready = true;
          clearTimeout(slowTimer);
          clearTimeout(retryTimer);
          observer.disconnect();
          if (recoveryAttempt) {
            var url = new URL(location.href);
            url.searchParams.delete(retryKey);
            try { history.replaceState(history.state, '', url.href); } catch (e) {}
          }
        }
        // Also recognize older app bundles during an HTML/cache version change.
        var observer = new MutationObserver(function () {
          if (root.querySelector('.app-shell')) appReady();
        });
        observer.observe(root, { childList: true, subtree: true });
        document.addEventListener('nr-app-ready', appReady);
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT' || event.message) failed();
        }, true);
        window.addEventListener('vite:preloadError', failed);
        document.getElementById('boot-reload').addEventListener('click', function (event) { event.stopPropagation(); retry(); });
        screen.addEventListener('click', function (event) {
          if (panel.contains(event.target)) return;
          screen.dataset.skip = 'true';
          skip.textContent = '正在进入…';
          document.dispatchEvent(new Event('nr-intro-skip'));
          if (!ready) showIssue('主程序仍在加载。若长时间没有进入，请重新加载。');
        });
        var slowTimer = setTimeout(function () { showIssue('加载时间较长，可以重新加载以获取最新网站文件。'); }, 10000);
        var retryTimer = setTimeout(function () { if (!ready && !recoveryAttempt && navigator.onLine !== false) retry(); }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
